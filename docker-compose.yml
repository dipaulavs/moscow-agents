version: '3.8'

services:
  app:
    image: moscow-agents:latest
    hostname: moscow-agents

    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - NODE_ENV=production
      - TZ=America/Sao_Paulo

    volumes:
      # Workspace persistente
      - workspace:/workspace
      # Configuração Claude persistente
      - claude_config:/home/claude/.claude
      # História ZSH persistente
      - zsh_history:/home/claude/.zsh_history
      # Git config (opcional)
      - ./gitconfig:/home/claude/.gitconfig:ro

    networks:
      - loop9Net

    # Manter container rodando para docker exec
    stdin_open: true
    tty: true

    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s

      # Labels Traefik (para futuro web terminal)
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=loop9Net"

        # HTTP
        - "traefik.http.routers.moscow-agents.rule=Host(`moscow-agents.loop9.com.br`)"
        - "traefik.http.routers.moscow-agents.entrypoints=web"
        - "traefik.http.routers.moscow-agents.middlewares=https-redirect"

        # HTTPS
        - "traefik.http.routers.moscow-agents-secure.rule=Host(`moscow-agents.loop9.com.br`)"
        - "traefik.http.routers.moscow-agents-secure.entrypoints=websecure"
        - "traefik.http.routers.moscow-agents-secure.tls=true"
        - "traefik.http.routers.moscow-agents-secure.tls.certresolver=letsencryptresolver"

        # Service (placeholder - sem porta exposta por enquanto)
        - "traefik.http.services.moscow-agents.loadbalancer.server.port=8080"

volumes:
  workspace:
  claude_config:
  zsh_history:

networks:
  loop9Net:
    external: true
